<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img"><rect x="0" y="0" width="760" height="400" fill="#f9f9f7"/><text x="24" y="34" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#0b0b0b" font-weight="bold" text-anchor="start">The test a team runs, against the test that applies</text><text x="24" y="56" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">the comparison is paired; the unpaired test treats the agreement as noise</text><rect x="24" y="84" width="710" height="254" rx="6" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><rect x="24" y="82" width="11" height="9" fill="#2a78d6"/><text x="41" y="91" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">McNemar, paired</text><rect x="234" y="82" width="11" height="9" fill="#eb6834"/><text x="251" y="91" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">two-proportion, unpaired</text><line x1="150.0" y1="100" x2="150.0" y2="290" stroke="#e1e0d9" stroke-width="1"/><text x="150.0" y="308" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#898781" font-weight="normal" text-anchor="middle">1e-4</text><line x1="262.5" y1="100" x2="262.5" y2="290" stroke="#e1e0d9" stroke-width="1"/><text x="262.5" y="308" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#898781" font-weight="normal" text-anchor="middle">1e-3</text><line x1="375.0" y1="100" x2="375.0" y2="290" stroke="#e1e0d9" stroke-width="1"/><text x="375.0" y="308" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#898781" font-weight="normal" text-anchor="middle">1e-2</text><line x1="487.5" y1="100" x2="487.5" y2="290" stroke="#e1e0d9" stroke-width="1"/><text x="487.5" y="308" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#898781" font-weight="normal" text-anchor="middle">1e-1</text><line x1="600.0" y1="100" x2="600.0" y2="290" stroke="#e1e0d9" stroke-width="1"/><text x="600.0" y="308" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#898781" font-weight="normal" text-anchor="middle">1</text><line x1="453.6" y1="94" x2="453.6" y2="292" stroke="#b42318" stroke-width="1.5" stroke-dasharray="5 3"/><text x="453.6341254878021" y="88" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#b42318" font-weight="bold" text-anchor="middle">alpha</text><text x="136" y="138.0" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="end">v1 to v2</text><rect x="150" y="120.0" width="375.6" height="10" rx="2" fill="#2a78d6"/><text x="533.5884565042096" y="129.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#2a78d6" font-weight="bold" text-anchor="start">0.2181</text><rect x="150" y="134.0" width="411.7" height="10" rx="2" fill="#eb6834"/><text x="569.6782038565198" y="143.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#eb6834" font-weight="bold" text-anchor="start">0.4564</text><text x="136" y="198.0" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="end">v2 to v3</text><rect x="150" y="180.0" width="116.7" height="10" rx="2" fill="#2a78d6"/><text x="274.7104810183202" y="189.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#2a78d6" font-weight="bold" text-anchor="start">0.0011</text><rect x="150" y="194.0" width="340.3" height="10" rx="2" fill="#eb6834"/><text x="498.31325067121645" y="203.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#eb6834" font-weight="bold" text-anchor="start">0.1059</text><text x="136" y="258.0" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="end">v1 to v3</text><rect x="150" y="240.0" width="2.0" height="10" rx="2" fill="#2a78d6"/><text x="158.0" y="249.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#2a78d6" font-weight="bold" text-anchor="start">0.0000</text><rect x="150" y="254.0" width="254.6" height="10" rx="2" fill="#eb6834"/><text x="412.55243873394085" y="263.0" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#eb6834" font-weight="bold" text-anchor="start">0.0183</text><line x1="150" y1="290" x2="600" y2="290" stroke="#c3c2b7" stroke-width="1.5"/><text x="375.0" y="330" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#898781" font-weight="normal" text-anchor="middle">p value, log scale</text><text x="24" y="364" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">on v2 to v3 the paired test says 0.0011 and the unpaired test says 0.1059:</text><text x="24" y="382" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">a real improvement the test a team reaches for would have thrown away.</text></svg>