<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img"><rect x="0" y="0" width="760" height="430" fill="#f9f9f7"/><text x="24" y="34" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#0b0b0b" font-weight="bold" text-anchor="start">What the delta is made of</text><text x="24" y="56" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#52514e" font-weight="normal" text-anchor="start">25,000 items, 1,000 of them with ground truth</text><rect x="24" y="96" width="330" height="44" rx="6" fill="#fcfcfb" stroke="#898781" stroke-width="1.5"/><text x="42" y="116" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#898781" font-weight="bold" text-anchor="start">held right</text><text x="42" y="132" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#898781" font-weight="normal" text-anchor="start">carries no information</text><text x="336" y="123" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#0b0b0b" font-weight="bold" text-anchor="end">765</text><rect x="24" y="150" width="330" height="44" rx="6" fill="#fcfcfb" stroke="#898781" stroke-width="1.5"/><text x="42" y="170" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#898781" font-weight="bold" text-anchor="start">held wrong</text><text x="42" y="186" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#898781" font-weight="normal" text-anchor="start">carries no information</text><text x="336" y="177" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#0b0b0b" font-weight="bold" text-anchor="end">140</text><rect x="24" y="204" width="330" height="44" rx="6" fill="#fcfcfb" stroke="#1baf7a" stroke-width="1.5"/><text x="42" y="224" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1baf7a" font-weight="bold" text-anchor="start">improved</text><text x="42" y="240" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#898781" font-weight="normal" text-anchor="start">a discordant pair</text><text x="336" y="231" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#0b0b0b" font-weight="bold" text-anchor="end">54</text><rect x="24" y="258" width="330" height="44" rx="6" fill="#fcfcfb" stroke="#b42318" stroke-width="1.5"/><text x="42" y="278" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#b42318" font-weight="bold" text-anchor="start">regressed</text><text x="42" y="294" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#898781" font-weight="normal" text-anchor="start">a discordant pair</text><text x="336" y="285" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#0b0b0b" font-weight="bold" text-anchor="end">41</text><rect x="386" y="96" width="344" height="98" rx="6" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/><text x="404" y="122" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#0b0b0b" font-weight="bold" text-anchor="start">the accuracy delta</text><text x="404" y="144" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">54 improved minus 41 regressed</text><text x="404" y="164" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0b0b0b" font-weight="bold" text-anchor="start">= 13 items, which is +1.3 points</text><text x="404" y="182" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#898781" font-weight="normal" text-anchor="start">the two grey boxes contribute nothing to it</text><rect x="386" y="212" width="344" height="98" rx="6" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/><text x="404" y="238" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#eb6834" font-weight="bold" text-anchor="start">and what it does not mention</text><text x="404" y="260" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">2,248 labels moved across the corpus</text><text x="404" y="278" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">2,153 of those with no ground truth</text><text x="404" y="296" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#0b0b0b" font-weight="normal" text-anchor="start">172.9 labels moved per net item gained</text><text x="24" y="340" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">Only the two coloured boxes carry evidence about the change. The delta is those two</text><text x="24" y="358" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#52514e" font-weight="normal" text-anchor="start">subtracted from each other, and the subtraction is where the rest goes.</text></svg>